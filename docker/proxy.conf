# Один vhost на все имена: localhost и admin.localhost (см. /etc/hosts: 127.0.0.1 admin.localhost).
# Так запросы не зависят от порядка VirtualHost и совпадения Host с/без порта.
<VirtualHost *:80>
    ServerName localhost
    ServerAlias admin.localhost 127.0.0.1 ::1
    ProxyPreserveHost On
    # Next.js за reverse proxy: явный host/proto (без дублирования с ProxyPass)
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}

    ProxyPass "/api" "http://app:80/api"
    ProxyPassReverse "/api" "http://app:80/api"

    ProxyPass "/uploads" "http://app:80/uploads"
    ProxyPassReverse "/uploads" "http://app:80/uploads"

    <Location /legacy-admin>
        RequestHeader set X-Bartery-Public-Base "/legacy-admin"
    </Location>
    ProxyPass "/legacy-admin" "http://app:80/admin"
    ProxyPassReverse "/legacy-admin" "http://app:80/admin"

    ProxyPass "/admin" "http://frontend:3000/admin"
    ProxyPassReverse "/admin" "http://frontend:3000/admin"

    ProxyPass "/_next/webpack-hmr"  "ws://frontend:3000/_next/webpack-hmr"
    ProxyPassReverse "/_next/webpack-hmr"  "ws://frontend:3000/_next/webpack-hmr"

    ProxyPass "/" "http://frontend:3000/"
    ProxyPassReverse "/" "http://frontend:3000/"
</VirtualHost>
